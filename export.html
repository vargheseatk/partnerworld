<meta charset="utf-8">
<title>Export Snippets — PartnerWorld</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 33C8 24 6 15 12 11c4-3 8 0 8 4 0-4 4-7 8-4 6 4 4 13-8 22z' fill='%23F5C542'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">

<div class="page">
  <div class="wrap">
    <section class="section">
      <span class="eyebrow">Export Snippets</span>
      <h2 class="title" style="margin-top:12px;">Grab a high-quality card for any actor.</h2>
      <p class="section-lead">Select any partner below — a preview opens on the right where you can download a print-ready card as a PNG.</p>

      <div id="export-tiers"></div>
    </section>

    <div class="footer">PartnerWorld™ · Export Snippets · High-resolution 1000×1400px PNG</div>
  </div>
</div>

<script src="assets/js/main.js"></script>
<script>
let currentAvatar = null;
let currentImgEl = null;

function buildExportPanel() {
  const backdrop = document.createElement('div');
  backdrop.className = 'pw-export-backdrop';
  backdrop.id = 'pw-export-backdrop';
  const panel = document.createElement('aside');
  panel.className = 'pw-export-panel';
  panel.id = 'pw-export-panel';
  panel.innerHTML = `
    <div class="pw-export-head">
      <h3>Export Preview</h3>
      <button class="close" id="pw-export-close">✕</button>
    </div>
    <div class="pw-export-preview" id="pw-export-preview"></div>
    <div class="pw-export-info">
      <div class="name" id="pw-export-name"></div>
      <div class="tags" id="pw-export-tags"></div>
      <div class="meta-row">
        <span class="chip" id="pw-export-tier"></span>
        <span class="price" id="pw-export-price" style="font-family:var(--font-head);font-size:20px;color:#fff;font-weight:600;"></span>
      </div>
    </div>
    <div class="pw-export-actions">
      <button class="btn btn-gold btn-block" id="pw-export-download">⬇ Download High Quality</button>
      <div class="pw-export-status" id="pw-export-status"></div>
    </div>`;
  document.body.appendChild(backdrop);
  document.body.appendChild(panel);

  const close = () => panel.classList.remove('open') || backdrop.classList.remove('open');
  document.getElementById('pw-export-close').addEventListener('click', close);
  backdrop.addEventListener('click', close);
  document.getElementById('pw-export-download').addEventListener('click', doDownload);
}

function openExportPanel(id) {
  const a = AVATARS.find(x => x.id === id);
  if (!a) return;
  currentAvatar = a;

  document.querySelectorAll('.export-tile').forEach(t => t.classList.toggle('selected', t.dataset.id === id));

  const preview = document.getElementById('pw-export-preview');
  const status = document.getElementById('pw-export-status');
  const dlBtn = document.getElementById('pw-export-download');
  dlBtn.disabled = true;
  status.textContent = 'Loading photo…';
  preview.innerHTML = avatarImg(a, '');
  currentImgEl = preview.querySelector('img');

  const ready = () => { dlBtn.disabled = false; status.textContent = 'Ready to download'; };
  if (currentImgEl.complete && currentImgEl.naturalWidth > 0) ready();
  else currentImgEl.addEventListener('load', ready, { once: true });

  document.getElementById('pw-export-name').textContent = a.name;
  document.getElementById('pw-export-tags').textContent = a.tags.join(' • ');
  document.getElementById('pw-export-tier').textContent = a.badge || a.model;
  document.getElementById('pw-export-price').textContent = '₹' + a.price + '/mo';

  document.getElementById('pw-export-panel').classList.add('open');
  document.getElementById('pw-export-backdrop').classList.add('open');
}

async function doDownload() {
  if (!currentAvatar || !currentImgEl) return;
  const status = document.getElementById('pw-export-status');
  const btn = document.getElementById('pw-export-download');
  btn.disabled = true;
  status.textContent = 'Rendering high-quality card…';
  try {
    const blob = await generateAvatarCardBlob(currentAvatar, currentImgEl);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentAvatar.id}-partnerworld-card.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    status.textContent = '✓ Downloaded';
  } catch (e) {
    status.textContent = 'Export failed — try again';
  } finally {
    btn.disabled = false;
  }
}

function tileHtml(a) {
  return `
    <div class="export-tile reveal" data-id="${a.id}">
      <div class="avatar-portrait">
        ${avatarImg(a)}
        <div class="overlay"></div>
      </div>
      <div class="export-tile-body">
        <div class="export-tile-name">${a.name}</div>
        <div class="export-tile-sub">₹${a.price}/month · ${a.badge || a.model}</div>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  buildExportPanel();
  const root = document.getElementById('export-tiers');
  root.innerHTML = TIERS.map(([key, label]) => {
    const list = AVATARS.filter(a => a.tier === key);
    return `
      <div class="tier-heading">
        <h3>${label}</h3>
        <span class="count">${list.length} Partners</span>
        <span class="line"></span>
      </div>
      <div class="grid grid-3">${list.map(tileHtml).join('')}</div>`;
  }).join('');

  root.querySelectorAll('.export-tile').forEach(tile => {
    tile.addEventListener('click', () => openExportPanel(tile.dataset.id));
  });
  requestAnimationFrame(() => {
    const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.15 });
    root.querySelectorAll('.reveal').forEach(el => io.observe(el));
  });
});
</script>
